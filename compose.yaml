services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user_import
      POSTGRES_USER: user_import
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_import -d user_import"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

